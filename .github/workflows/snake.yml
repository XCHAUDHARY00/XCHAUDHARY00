name: GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Snake Contribution
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: actions/upload-artifact@v3
        with:
          name: snake-artifacts
          path: dist/

      - name: Create output branch if needed
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git fetch origin output 2>/dev/null || git checkout --orphan output
          git checkout output 2>/dev/null || git checkout -b output

      - name: Copy generated files to output branch
        run: |
          mkdir -p output
          cp dist/github-contribution-grid-snake.svg output/
          cp dist/github-contribution-grid-snake-dark.svg output/
          git add output/
          git commit -m "Generate snake contribution graph $(date)" || true
          git push -f origin output
        continue-on-error: true

      - name: Verify output files
        run: |
          echo "Checking output branch files..."
          git ls-tree -r output
